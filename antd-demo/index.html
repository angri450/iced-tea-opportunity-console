<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="康师傅冰红茶热梗机会判定台，示例数据" />
    <!-- 告诉浏览器页面同时支持浅色与深色，避免首帧白闪 -->
    <meta name="color-scheme" content="light dark" />
    <!-- 跟随系统文字缩放，页面字号用 rem -->
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
    <title>冰红茶机会台 · 热梗判定</title>
    <script>
      // 首帧前定主题，避免先亮后暗的闪烁
      (function () {
        try {
          var saved = localStorage.getItem('iced-tea-theme')
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : system
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
